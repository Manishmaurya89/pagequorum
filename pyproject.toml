[project]
name = "pagequorum"
version = "0.1.0"
description = "Accurate web-page extraction for RAG: several proven extractors vote on every block of the page, and the result keeps its structure (headings, tables, code, lists) as clean Markdown with citation-ready chunks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Manish Maurya" }]
requires-python = ">=3.10"
keywords = ["rag", "web-scraping", "content-extraction", "boilerplate-removal", "markdown", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
    "lxml_html_clean>=0.1",
    "trafilatura>=2.0",
    "readability-lxml>=0.8.1",
    "justext>=3.0",
    "resiliparse>=0.14",
    "protego>=0.3",
    "charset-normalizer>=3.0",
]

[project.optional-dependencies]
# JavaScript-rendered pages. After installing, run: playwright install chromium
render = ["playwright>=1.40"]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
pagequorum = "pagequorum.cli:main"

[dependency-groups]
dev = [
    "fastapi>=0.110",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pagequorum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# starlette asks for httpx2 in its test client; httpx works and is what we ship with.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
