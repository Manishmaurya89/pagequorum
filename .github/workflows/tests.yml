# Runs the test suite on the oldest and newest supported Python. The tests are
# offline (no DNS, no network): see tests/conftest.py.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra web --python ${{ matrix.python }}
      - run: uv run --locked pytest -q
